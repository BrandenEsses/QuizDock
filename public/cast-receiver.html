<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizDock Cast TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081b5b;color:#fff;font-family:Arial,system-ui,sans-serif}body{padding:2.4vh 3vw}#waiting{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:3vw;background:#081b5b}#screen{height:100%;display:flex;flex-direction:column;gap:1.5vh}header{display:flex;align-items:center;justify-content:space-between;gap:1vw}h1{font-size:3vw;margin:0;color:#ffd05d}#round{font-size:1.6vw;color:#ccd9ff}#scores{display:flex;gap:1vw;flex-wrap:wrap;min-height:8vh}.score{background:#162c78;border-radius:.7vw;padding:.7vw 1.4vw;font-size:1.6vw;min-width:10vw}.score strong{display:block;color:#ffcf57;font-size:2.2vw}.score.active{outline:3px solid #ffd05d}#main{flex:1;min-height:0;display:flex;align-items:stretch}#board{width:100%;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:.4vw;grid-auto-rows:minmax(0,1fr)}.cell{background:#1434a2;border:1px solid #5277ed;border-radius:.3vw;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;padding:.5vw;min-width:0}.cat{font-size:1.5vw;font-weight:700}.tile{color:#ffd05d;font-size:2.6vw;font-weight:800}#clue{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(30px,4.2vw,88px);line-height:1.3;padding:2vw 4vw;white-space:pre-wrap}#final{width:100%;overflow:auto;font-size:2.3vw}#final .answer{margin:1vh 0;background:#173174;border-radius:1vw;padding:1vw}#footer{font-size:1.4vw;color:#c6d5ff;min-height:2vh}#error{color:#ffd05d}[hidden]{display:none!important}
</style></head><body>
<div id="waiting">Waiting for QuizDock host...</div>
<div id="screen" hidden><header><h1 id="title">QuizDock</h1><div id="round"></div></header><div id="scores"></div><main id="main"><div id="board"></div><div id="clue" hidden></div><div id="final" hidden></div></main><div id="footer"></div></div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const namespace='urn:x-cast:dev.ble.quizdock';
let activeRoom=null, gameState=null, socket=null;
const $=id=>document.getElementById(id);
function el(tag,className,content){const node=document.createElement(tag);if(className)node.className=className;if(content!==undefined)node.textContent=String(content);return node;}
function setVisible(id,visible){$(id).hidden=!visible;}
function render(s){
  gameState=s;
  $('waiting').hidden=true;$('screen').hidden=false;
  $('title').textContent=s.board?.title||'QuizDock';
  $('round').textContent=(s.round==='double'?'Double Jeopardy':s.round==='final'?'Final Jeopardy':'Jeopardy')+' · Room '+(s.code||activeRoom);
  const scores=$('scores');scores.replaceChildren();
  for(const p of s.players||[]){const card=el('div','score'+(p.id===s.active?' active':''),p.name);const amount=el('strong','',p.score<0?'−$'+Math.abs(p.score):'$'+p.score);card.appendChild(amount);scores.appendChild(card);}
  const phase=s.phase||'lobby';const cats=s.board?.categories||[];
  const board=$('board');const showBoard=phase==='board'||phase==='lobby';setVisible('board',showBoard);
  if(showBoard&&cats.length){board.style.setProperty('--cols',cats.length);board.replaceChildren();for(const c of cats)board.appendChild(el('div','cell cat',c.name));const rows=Math.max(...cats.map(c=>c.count||0));for(let row=0;row<rows;row++)for(let col=0;col<cats.length;col++){const c=cats[col];const available=row<c.count&&!(s.used||[]).includes(col+':'+row);board.appendChild(el('div','cell tile',available?'$'+(row+1)*200*(s.round==='double'?2:1):''));}}
  const showClue=!!s.clue&&phase!=='finalReveal'&&!showBoard;setVisible('clue',showClue);if(showClue)$('clue').textContent=s.clue.text||'';
  const showFinal=phase==='finalReveal';setVisible('final',showFinal);
  if(showFinal){const final=$('final');final.replaceChildren();for(const response of s.finalResponses||[]){const name=(s.players||[]).find(p=>p.id===response.id)?.name||'Player';const card=el('div','answer',name+': '+(response.response||'(handwritten response)'));if(response.image){const img=el('img');img.src=response.image;img.style.maxHeight='20vh';img.style.maxWidth='100%';card.appendChild(img);}final.appendChild(card);}}
  $('footer').textContent=phase==='lobby'?'Waiting for players':phase==='buzz'?'Buzzers open':phase==='answer'?'Player answering':phase==='judge'?'Host reviewing answer':phase==='reveal'?'Answer: '+(s.answer||''):phase==='finalWager'?'Final Jeopardy wagers':phase==='finalAnswer'?'Final Jeopardy responses':'';
}
function subscribe(){if(!socket?.connected||!activeRoom)return;socket.emit('spectate',activeRoom,result=>{if(!result?.ok){console.warn('QuizDock TV spectate:',result?.error);if(!gameState){$('waiting').textContent='Waiting for game room '+activeRoom+'...';}}});}
function ensureSocket(){if(socket)return;socket=io({transports:['websocket','polling'],reconnection:true,reconnectionDelay:1000,reconnectionDelayMax:5000});socket.on('connect',subscribe);socket.on('state',s=>{if(s?.code===activeRoom)render(s);});socket.on('connect_error',e=>console.warn('QuizDock TV connection error:',e.message));socket.on('disconnect',reason=>console.info('QuizDock TV disconnected:',reason));}
function showRoom(code){const next=String(code||'');if(!/^\d{6}$/.test(next))return;if(next===activeRoom){subscribe();return;}activeRoom=next;gameState=null;$('waiting').textContent='Connecting to room '+next+'...';$('waiting').hidden=false;$('screen').hidden=true;ensureSocket();subscribe();console.info('QuizDock TV selected room',next);}
try{const context=cast.framework.CastReceiverContext.getInstance();context.addCustomMessageListener(namespace,event=>{let msg=event.data;if(typeof msg==='string'){try{msg=JSON.parse(msg);}catch{return;}}if(msg&&msg.type==='room')showRoom(msg.code);});context.start({disableIdleTimeout:true});console.info('QuizDock direct-render receiver ready');}catch(e){console.error('QuizDock Cast init failed',e);$('waiting').textContent='Cast receiver failed to initialize';}
</script></body></html>
