services:
  quizdock:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./downloads:/app/downloads
    environment:
      PORT: "3000"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      OPENAI_BOARD_MODEL: "${OPENAI_BOARD_MODEL:-gpt-6-luna}"
      OPENAI_BOARD_REASONING: "${OPENAI_BOARD_REASONING:-medium}"
      OPENAI_BOARD_MAX_OUTPUT_TOKENS: "${OPENAI_BOARD_MAX_OUTPUT_TOKENS:-16000}"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-150}"
      OPENAI_JUDGE_MODEL: "${OPENAI_JUDGE_MODEL:-gpt-6-luna}"
      OPENAI_JUDGE_REASONING: "${OPENAI_JUDGE_REASONING:-low}"
      AI_GENERATION_ATTEMPTS: "${AI_GENERATION_ATTEMPTS:-2}"
      AI_GAME_CACHE_TTL_SECONDS: "${AI_GAME_CACHE_TTL_SECONDS:-3600}"
      AI_GAME_CACHE_LIMIT: "${AI_GAME_CACHE_LIMIT:-20}"
      CLUE_SECONDS: "${CLUE_SECONDS:-24}"
      ANSWER_SECONDS: "${ANSWER_SECONDS:-30}"
      READING_SECONDS: "${READING_SECONDS:-10}"
      DAILY_DOUBLE_WAGER_SECONDS: "${DAILY_DOUBLE_WAGER_SECONDS:-30}"
      DAILY_DOUBLE_READING_SECONDS: "${DAILY_DOUBLE_READING_SECONDS:-12}"
      DAILY_DOUBLE_ANSWER_SECONDS: "${DAILY_DOUBLE_ANSWER_SECONDS:-10}"
      ROUND_SECONDS: "${ROUND_SECONDS:-1200}"
      FINAL_WAGER_SECONDS: "${FINAL_WAGER_SECONDS:-60}"
      FINAL_ANSWER_SECONDS: "${FINAL_ANSWER_SECONDS:-60}"
      REVEAL_SECONDS: "${REVEAL_SECONDS:-6}"
      CAST_APP_ID: "${CAST_APP_ID:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PEXELS_API_KEY: "${PEXELS_API_KEY:-}"
      FREESOUND_API_KEY: "${FREESOUND_API_KEY:-}"

  apk-builder:
    profiles: ["build-apk"]
    build:
      context: .
      dockerfile: Dockerfile.android-build
    working_dir: /workspace
    environment:
      GRADLE_USER_HOME: /buildhome/gradle
    volumes:
      - ./android:/workspace
      - ./.android-build-home:/buildhome
      - ./downloads:/output
    command: ["bash", "-lc", "set -e; mkdir -p /buildhome/.android; ln -sfn /buildhome/.android /root/.android; gradle --no-daemon :app:assembleDebug; install -m 644 app/build/outputs/apk/debug/app-debug.apk /output/quizdock.apk; sha256sum /output/quizdock.apk"]
